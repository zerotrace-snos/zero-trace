<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero-Trace</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #05070d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    color: #fff;
    padding: 20px;
  }

  /* ===== ПОДСКАЗКА СВЕРХУ ===== */
  .hint {
    position: relative;
    z-index: 3;
    width: 380px;
    max-width: 92vw;
    padding: 16px 18px;
    margin-bottom: 24px;
    border-radius: 16px;
    background: rgba(8, 12, 24, 0.85);
    border: 1.5px solid rgba(43, 108, 255, 0.45);
    box-shadow:
      0 0 0 1px rgba(43, 108, 255, 0.15),
      0 0 30px rgba(43, 108, 255, 0.25);
    backdrop-filter: blur(12px);
    text-align: left;
    font-size: 14px;
    line-height: 1.45;
    color: #dbe6ff;
  }

  .hint-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 15px;
    color: #ffffff;
    margin-bottom: 6px;
  }

  .hint-text {
    color: #b9cdf0;
    font-size: 14px;
  }

  .hint-text b {
    color: #ffffff;
    font-weight: 700;
  }

  /* ===== ФОНОВЫЕ ПРИЗРАКИ — БЕЗ КВАДРАТОВ ===== */
  .ghost {
    position: absolute;
    width: 46px;
    height: 46px;
    opacity: 0.45;
    animation: float 6s ease-in-out infinite;
    user-select: none;
    pointer-events: none;
    background: transparent;
    border: none;
    box-shadow: none;
  }
  .ghost svg {
    width: 100%;
    height: 100%;
    display: block;
    background: transparent;
    border: none;
    filter: drop-shadow(0 0 10px #2b6cff) drop-shadow(0 0 22px #2b6cff);
  }
  .ghost svg path { fill: #2b6cff; }

  .ghost:nth-child(1) { top: 8%;  left: 6%;  animation-delay: 0s; }
  .ghost:nth-child(2) { top: 20%; left: 85%; animation-delay: 1s; }
  .ghost:nth-child(3) { top: 70%; left: 10%; animation-delay: 2s; }
  .ghost:nth-child(4) { top: 80%; left: 80%; animation-delay: 0.5s; }
  .ghost:nth-child(5) { top: 45%; left: 3%;  animation-delay: 1.5s; }
  .ghost:nth-child(6) { top: 55%; left: 92%; animation-delay: 2.5s; }
  .ghost:nth-child(7) { top: 5%;  left: 50%; animation-delay: 0.8s; }
  .ghost:nth-child(8) { top: 92%; left: 45%; animation-delay: 1.8s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-18px) rotate(4deg); }
  }

  /* ===== КАРТОЧКА ===== */
  .card {
    position: relative;
    z-index: 2;
    width: 380px;
    max-width: 92vw;
    padding: 40px 28px 32px;
    border-radius: 22px;
    background: rgba(8, 12, 24, 0.85);
    border: 1.5px solid rgba(43, 108, 255, 0.45);
    box-shadow:
      0 0 0 1px rgba(43, 108, 255, 0.15),
      0 0 40px rgba(43, 108, 255, 0.25),
      inset 0 0 60px rgba(43, 108, 255, 0.05);
    backdrop-filter: blur(12px);
    text-align: center;
  }

  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 16px;
    background: rgba(43, 108, 255, 0.08);
    border: 1.5px solid rgba(43, 108, 255, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 22px rgba(43, 108, 255, 0.45);
  }

  .title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    text-shadow: 0 0 18px rgba(43, 108, 255, 0.6);
  }

  .subtitle {
    font-size: 14px;
    color: #8fa3c8;
    margin-bottom: 20px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(43, 108, 255, 0.1);
    border: 1px solid rgba(43, 108, 255, 0.45);
    font-size: 12.5px;
    color: #b9cdf0;
    margin-bottom: 26px;
    box-shadow: 0 0 14px rgba(43, 108, 255, 0.2);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 17px 20px;
    border-radius: 14px;
    background: rgba(10, 18, 38, 0.9);
    border: 1.5px solid rgba(43, 108, 255, 0.55);
    color: #eaf1ff;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 0 0 rgba(43, 108, 255, 0);
  }

  .btn:hover {
    background: rgba(43, 108, 255, 0.18);
    border-color: #4d8bff;
    box-shadow: 0 0 26px rgba(43, 108, 255, 0.55);
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0);
  }

  .footer {
    margin-top: 18px;
    font-size: 12px;
    color: #6b7fa3;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #2b6cff;
    box-shadow: 0 0 8px #2b6cff;
  }

  /* ===== МОБИЛЬНАЯ ВЕРСИЯ ===== */
  @media (max-width: 480px) {
    body { justify-content: flex-start; padding-top: 24px; }
    .ghost { width: 38px; height: 38px; }
    .card { padding: 34px 22px 28px; }
    .title { font-size: 28px; }
    .hint { padding: 14px 16px; font-size: 13.5px; }
    .hint-title { font-size: 14.5px; }
    .hint-text { font-size: 13.5px; }
  }
</style>
</head>
